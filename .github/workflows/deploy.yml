name: Deploy

on:
    push:
        branches: [main, dev]
    workflow_dispatch:

# Coolify now builds the image on the NAS build server (nas-builder) and deploys it
# natively, so this workflow only TRIGGERS Coolify and verifies the result. main
# deploys both load-balanced instances A then B, verifying each separately so the
# site never drops. Runs on a GitHub-hosted runner (no self-hosted runner needed).
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # One line per pushed commit: linked short hash + first line of the message,
            # trimmed so the embed stays under Discord's 4096-char description limit.
            # workflow_dispatch has no commit list, so fall back to the checked-out HEAD.
            - name: Collect commits for the Discord message
              env:
                  COMMITS: ${{ toJSON(github.event.commits) }}
                  REPO_URL: ${{ github.server_url }}/${{ github.repository }}
              run: |
                  if [ "$COMMITS" = "null" ] || [ "$COMMITS" = "[]" ]; then
                    COMMITS=$(git log -1 --format='%H%x00%s' | jq -Rc --arg u "$REPO_URL" 'split("\u0000") | [{id: .[0], message: .[1], url: ($u + "/commit/" + .[0])}]')
                  fi
                  echo "$COMMITS" | jq -r '
                    def short: if length > 72 then .[0:71] + "…" else . end;
                    (map("[`\(.id[0:7])`](\(.url)) \(.message | split("\n")[0] | short)")) as $l
                    | ($l[0:15] | join("\n")) + (if ($l | length) > 15 then "\n+\(($l | length) - 15) more" else "" end)
                  ' > "$RUNNER_TEMP/commits.txt"
                  cat "$RUNNER_TEMP/commits.txt"

            - name: Check app version is in sync (abort deploy on mismatch)
              run: node .github/ci/check-version-sync.mjs

            - name: Deploy + verify each instance
              run: |
                  set -u
                  CO=https://panel.filipkin.com/api/v1
                  AUTH="Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
                  deploy_and_wait() {
                    local uuid="$1" name="$2"
                    if [ -z "$uuid" ]; then echo "$name: no UUID configured, skipping"; return 0; fi
                    local dep
                    dep=$(curl -s -X POST "$CO/deploy?uuid=$uuid&force=false" -H "$AUTH" | python3 -c 'import sys,json;print(json.load(sys.stdin)["deployments"][0]["deployment_uuid"])')
                    echo "$name -> deployment $dep"
                    for i in $(seq 1 90); do
                      s=$(curl -s "$CO/deployments/$dep" -H "$AUTH" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("status",""))')
                      echo "  $name attempt $i: $s"
                      [ "$s" = "finished" ] && return 0
                      { [ "$s" = "failed" ] || [ "$s" = "error" ]; } && { echo "$name failed"; return 1; }
                      sleep 10
                    done
                    echo "$name timed out"; return 1
                  }
                  if [ "${{ github.ref_name }}" = "main" ]; then
                    deploy_and_wait "${{ secrets.INSTANCE_A_UUID }}" "Instance A" || exit 1
                    deploy_and_wait "${{ secrets.INSTANCE_B_UUID }}" "Instance B" || exit 1
                  else
                    deploy_and_wait "${{ secrets.DEV_UUID }}" "Dev" || exit 1
                  fi

            - name: Notify Discord (success)
              if: success() && github.ref_name == 'main'
              env:
                  WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
              run: |
                  jq -n --rawfile c "$RUNNER_TEMP/commits.txt" \
                    '{embeds: [{title: "✅ FTA Buddy Deployed", description: ($c | rtrimstr("\n")), color: 3066993}]}' \
                    | curl -s -X POST "$WEBHOOK" -H "Content-Type: application/json" -d @-

            - name: Notify Discord (failure)
              if: failure() && github.ref_name == 'main'
              env:
                  WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  touch "$RUNNER_TEMP/commits.txt"
                  jq -n --rawfile c "$RUNNER_TEMP/commits.txt" --arg run "$RUN_URL" \
                    '{embeds: [{title: "❌ FTA Buddy Deploy Failed", description: (($c | rtrimstr("\n")) + "\n[GitHub Actions](" + $run + ")"), color: 15158332}]}' \
                    | curl -s -X POST "$WEBHOOK" -H "Content-Type: application/json" -d @-
